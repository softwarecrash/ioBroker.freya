name: Dependabot Auto-Merge

on:
    pull_request_target:
        types: [opened, synchronize, reopened]

permissions:
    contents: write
    pull-requests: write

jobs:
    enable-auto-merge:
        if: >-
            github.repository == 'softwarecrash/ioBroker.freya' &&
            github.event.pull_request.user.login == 'dependabot[bot]'
        runs-on: ubuntu-latest
        steps:
            - name: Read trusted Dependabot metadata
              id: metadata
              uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Enable squash auto-merge for safe patch and minor updates
              if: >-
                  (steps.metadata.outputs.package-ecosystem == 'npm' ||
                  steps.metadata.outputs.package-ecosystem == 'github-actions') &&
                  (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
                  steps.metadata.outputs.update-type == 'version-update:semver-minor')
              run: gh pr merge --auto --squash "$PR_URL"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
